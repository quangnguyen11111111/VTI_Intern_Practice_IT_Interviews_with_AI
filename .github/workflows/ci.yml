name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Scan working tree without printing values
        run: node .github/scripts/secret-scan.mjs

      - name: Scan pull request or push commit range
        # gitleaks-action derives the event's base..head range and invokes Gitleaks with full redaction.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  build-and-lint:
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: Test Backend with Coverage
        run: npm run test:coverage

      - name: Test AIP-56 Concurrency Stability
        shell: bash
        run: |
          for run in {1..10}; do
            npx vitest run tests/ai-provider.contract.test.ts tests/interview-concurrency.integration.test.ts
          done

      - name: Test Client with Coverage
        run: npm run test:coverage --prefix client

      - name: Lint Client
        run: npm run lint --prefix client

      - name: Build Client
        run: npm run build --prefix client

      - name: Build Backend
        run: npm run build

      - name: Verify production artifacts
        run: node .github/scripts/verify-artifacts.mjs dist client/dist
