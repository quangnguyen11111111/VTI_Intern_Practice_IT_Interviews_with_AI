name: Deploy Node.js App to Tenten VPS

permissions:
  contents: read

on:
  push:
    branches:
      - main # Hoặc master tùy nhánh chính của bạn

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Install and Build Backend
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Install and Build Frontend
        run: |
          cd client
          npm ci
          npm run build

      - name: Verify production artifacts
        run: node .github/scripts/verify-artifacts.mjs dist client/dist

      - name: Prepare Deployment Package
        run: |
          # Nén các file và thư mục cần thiết để copy lên server cho nhanh
          tar -czf deploy.tar.gz dist/ node_modules/ package.json client/dist/

      - name: Copy Deployment Package to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "deploy.tar.gz"
          target: "/var/www/VTI_Intern_Practice_IT_Interviews_with_AI"

      - name: Extract and Restart PM2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/VTI_Intern_Practice_IT_Interviews_with_AI
            
            # Giải nén package
            tar -xzf deploy.tar.gz
            
            # Khởi động lại ứng dụng qua PM2
            pm2 restart vti-app || pm2 start dist/server.js --name "vti-app"
